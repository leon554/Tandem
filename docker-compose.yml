services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foodtracker
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foodtracker"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/foodtracker
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./api/src:/app/src
      - ./api/drizzle:/app/drizzle
      - ./api/drizzle.config.ts:/app/drizzle.config.ts
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
